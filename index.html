<script>
'use strict';
const API = 'https://vaitkevix.cloud/sh/api/dl', PINK = 'shd_pin';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { pin: ls.get(PINK) || '', tab: 'obj', day: '', f: 'all', q: '', sel: '', D: null, O: null, T: null, set: 'obj', I: null, kam: 'visi' };
const ROLE = { admin: 'Administrators', vaditajs: 'Pieteicējs', skatitajs: 'Skatītājs' }, RW = { admin: 3, vaditajs: 2, skatitajs: 0 };
const AM = { uzk: 'Uzkopējs', set: 'Sētnieks', abi: 'Abi' }, WD = ['P', 'O', 'T', 'C', 'Pk', 'S', 'Sv'];
const MON = ['janvāris', 'februāris', 'marts', 'aprīlis', 'maijs', 'jūnijs', 'jūlijs', 'augusts', 'septembris', 'oktobris', 'novembris', 'decembris'];
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = (d) => { const w = new Date(d + 'T12:00:00Z').getUTCDay(); return w === 0 ? 7 : w; };
const lvLong = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('lv-LV', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const lvS = (d) => d ? (+d.slice(8, 10)) + '.' + d.slice(5, 7) + '.' : '';
const H = (m) => { m = Math.round(+m || 0); return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') + ' min' : ''); };
const Hs = (m) => (Math.round((+m || 0) / 6) / 10).toLocaleString('lv-LV') + ' h';
const can = (n) => S.D && (RW[S.D.me.role] || 0) >= n;
const hm = (t) => String(t || '').slice(11, 16) || String(t || '').slice(0, 5);

function toast(t, kind) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
const NET = 'Nav interneta vai vājš signāls — mēģiniet vēlreiz';
async function api(action, data) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  let r; try { r = await fetch(API, { method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, data || {})) }); }
  catch (e) { const er = new Error(NET); er.code = 'net'; throw er; } finally { clearTimeout(tm); }
  const j = await r.json().catch(() => ({ ok: false, error: 'Serveris neatbild — mēģiniet vēlreiz', code: 'net' }));
  if (!j.ok) { const e = new Error(j.error || 'Kļūda'); e.code = j.code; throw e; }
  return j;
}
function sheet(html) { closeSheet(); const b = document.createElement('div'); b.className = 'sheet-bg'; b.id = 'sheetBg'; b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('click', e => { if (e.target.closest('[data-x]') || e.target === b) closeSheet(); }); document.body.appendChild(b); return b.firstChild; }
function closeSheet() { const b = $('sheetBg'); if (b) b.remove(); }
const XB = '<button class="ib" data-x aria-label="Aizvērt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
const busy = (b, t) => { b.disabled = true; b.dataset.t = b.textContent; b.textContent = t; };
const unbusy = (b) => { b.disabled = false; if (b.dataset.t) b.textContent = b.dataset.t; };

/* Punkts + teksts (ne tikai krāsa) */
function stTxt(r) { return !r || r.statuss === 'nevajag' ? 'nevajag' : r.statuss === 'darba' ? 'darbā ' + r.laiks : r.statuss === 'beidza' ? 'beidza ' + (r.beidz || '') : 'nav'; }
function dot(r) { const s = r && r.statuss; return `<i class="pd ${s === 'darba' ? 'g' : s === 'beidza' ? 'b' : s === 'nav' ? 'r' : 'n'}" aria-hidden="true"></i>`; }
const nrm = (x) => String(x || '').toLowerCase().replace(/\s+/g, ' ').trim(), isMine = (o) => !!(S.D && S.D.me && o && o.vaditajs && nrm(o.vaditajs) === nrm(S.D.me.name));
const secH = (t, n) => `<div class="sech">${esc(t)}<span>${n}</span></div>`;
const roleLine = (o, k) => { const P = (o[k] && o[k].ppl) || [], sh = P.length > 4 ? P.slice(0, 3) : P; const dd = `<b class="pds"${P.length > 1 ? ` title="${P.length} darbinieki"` : ''}>${P.length > 1 ? sh.map(s => dot({ statuss: s })).join('') + (P.length > 4 ? `<small>+${P.length - 3}</small>` : '') : dot(o[k]).replace('class="pd ', 'class="pd one ')}</b>`;
  return `<span>${dd}${AM[k]}<em>${esc(stTxt(o[k]))}</em></span>`; };

/* ---------- ieeja ---------- */
function showGate(msg) { $('vApp').hidden = true; $('tabs').hidden = true; $('sideNav').hidden = true; $('vGate').hidden = false; $('gErr').textContent = msg || ''; setTimeout(() => $('gPin').focus(), 100); }
$('gateForm').onsubmit = async (e) => { e.preventDefault(); S.pin = $('gPin').value.trim(); if (!S.pin) return; try { await load(); ls.set(PINK, S.pin); } catch (err) { showGate(err.message); } };
function logout() { ls.del(PINK); S.pin = ''; S.D = null; closeSheet(); showGate(''); }

async function load() {
  const r = await api('boot', S.day ? { datums: S.day } : {});
  S.D = r; S.G = null; if (!S.day) S.day = r.today;
  $('vGate').hidden = true; $('vApp').hidden = false;
  $('hdSub').textContent = r.me.name + ' · ' + (ROLE[r.me.role] || r.me.role);
  $('btnMe').textContent = r.me.name.replace(/^SIA\s+/i, '').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  drawTabs(); await draw(); if (window.SHXR && !S.tq) { S.tq = 1; SHXR.maybeTour(); }
}
function tabsList() { return [['obj', 'Objekti'], ['tab', 'Tabele']].concat(can(2) ? [['wrk', 'Darbinieki'], ['sms', 'SMS']] : []).concat(can(3) ? [['set', 'Iestatījumi']] : []); }
function drawTabs() {
  const T = tabsList(); if (!T.some(x => x[0] === S.tab)) S.tab = 'obj';
  const b = ([k, l]) => `<button type="button" data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`;
  $('tabs').innerHTML = T.map(b).join(''); $('tabs').hidden = false;
  $('sideNav').innerHTML = T.map(b).join('') + `<div class="sm">${S.D ? esc(S.D.kopsavilkums.objekti) + ' objekti · ' + esc(S.D.kopsavilkums.darbinieki) + ' darbinieki' : ''}</div>`; $('sideNav').hidden = false;
  document.body.classList.add('has-nav');
}
const goTab = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; S.tab = b.dataset.t; drawTabs(); draw(); scrollTo(0, 0); };
$('tabs').onclick = goTab; $('sideNav').onclick = goTab;
$('btnRefresh').onclick = () => load().then(() => toast('Atjaunots')).catch(err => toast(err.message, 'err'));
function applyTheme(t) { document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; }
$('btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); ls.set('sh_theme', t); };
addEventListener('storage', (e) => { if (e.key === 'sh_theme') applyTheme(e.newValue); });
addEventListener('message', (e) => { const m = e.data; if (e.origin === location.origin && m && m.sh === 'theme') applyTheme(m.t); });
$('btnMe').onclick = () => { const s = sheet(`<div class="hd"><h3>${esc(S.D.me.name)}</h3>${XB}</div><p style="font-weight:700;color:var(--ink2);margin:0 0 14px">${esc(ROLE[S.D.me.role] || '')}</p>
  <div class="card" style="margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink2)">Darbinieki atzīmējas ar SMS uz biroja telefonu: <b>START</b> un objekta kods (piem. START 104), beidzot — <b>STOP</b>, statuss — <b>?</b>. Atbildi saņem uzreiz.</div>
  ${S.pin ? '<button class="pill big" style="width:100%" id="mOut">Iziet</button>' : '<button class="pill dk big" style="width:100%" id="mIn">Ienākt ar PIN</button>'}`);
  const o = s.querySelector('#mOut'); if (o) o.onclick = logout; const i = s.querySelector('#mIn'); if (i) i.onclick = () => { closeSheet(); showGate(''); }; };

async function draw() {
  const v = $('view');
  try {
    if (S.tab === 'obj') return drawObj(v);
    if (S.tab === 'tab') return await drawTab(v);
    if (S.tab === 'sms') return await drawSms(v);
    if (S.tab === 'set') return await drawSet(v);
    if (S.tab === 'wrk') return await drawWrk(v);
  } catch (err) { v.innerHTML = `<div class="card empty">${esc(err.message)}</div>`; }
}

/* ---------- Objekti ---------- */
function drawObj(v) {
  const D = S.D, K = D.kopsavilkums, wd = dow(S.day) <= 5, isT = S.day === D.today;
  const inW = (o) => o.uzk.statuss === 'darba' || o.set.statuss === 'darba';
  const VAD = [...new Set(D.objekti.map(o => o.vaditajs || ''))].sort((a, b) => !a ? 1 : !b ? -1 : (isMine({ vaditajs: b }) - isMine({ vaditajs: a })) || a.localeCompare(b, 'lv'));
  if (S.vad == null) S.vad = ls.get('dl_vad') || ''; if (S.vad && !VAD.includes(S.vad === '-' ? '' : S.vad)) S.vad = '';
  const B0 = S.vad ? D.objekti.filter(o => (o.vaditajs || '') === (S.vad === '-' ? '' : S.vad)) : D.objekti.slice();
  const cnt = { all: B0.length, darba: B0.filter(inW).length, miss: B0.filter(o => o.trukst).length, ok: B0.filter(o => !o.trukst).length };
  let L = B0.slice(); const q = S.q.toLowerCase();

        return `<div class="cfl ${on ? 'done' : ''}"><span>${on ? `<b>${nm}</b> tiks noņemts no šī objekta, saglabājot.` : `Šajā objektā jau strādā <b>${nm}</b> · ${esc(AM[r.a.amats].toLowerCase())}. Vai noņemt veco darbinieku?`}</span><button type="button" class="pill" data-un="${esc(k)}">${on ? 'Atcelt' : 'Noņemt veco'}</button></div>`; }).join('');
      return `<div class="card ${open.length ? 'cbad' : ''}" style="margin:0 0 8px;padding:10px 12px"><div style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><b style="flex:1;font-size:14px">${esc(o ? o.adrese : x.anorm)}${o && o.kods ? ` <span style="color:var(--ink3)">· ${esc(o.kods)}</span>` : ''}</b><button type="button" class="pill" style="min-height:32px;padding:0 12px" data-rm="${i}" aria-label="Noņemt">✕</button></div>${amC(x.amats, i)}${x.amats ? '' : '<small style="display:block;margin-top:6px;color:var(--err,#b42318);font-weight:800">Izvēlieties amatu</small>'}${cw}</div>`; }).join('')
      || '<div class="card" style="margin:0;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--ink3)">Nav objektu — pievienojiet zemāk</div>'; prev(); };
  const prev = () => { const el = $('wPrev'); if (!el) return; el.innerHTML = smsBubbles(smsParts($('wV').value || nm0, L));
    const ck = $('wSms'); if ($('wPrevBox')) $('wPrevBox').style.opacity = ck && !ck.checked ? '.45' : '1'; };
  draw(); $('wV').oninput = prev; if ($('wSms')) $('wSms').onchange = prev;
  $('wL').onclick = (e) => { const un = e.target.closest('[data-un]'); if (un) { const k = un.dataset.un; U.has(k) ? U.delete(k) : U.add(k); return draw(); }
    const rm = e.target.closest('[data-rm]'); if (rm) { L.splice(+rm.dataset.rm, 1); return draw(); }
    const b = e.target.closest('[data-a]'), c = b && b.closest('[data-i]'); if (!c) return; L[+c.dataset.i].amats = b.dataset.a; draw(); };
  $('wOb').onchange = () => { const v = $('wOb').value; $('wOb').value = ''; if (!v || L.some(x => x.anorm === v)) return; L.push({ anorm: v, amats: '' }); draw(); };
  if (s.querySelector('#wDel')) s.querySelector('#wDel').onclick = async (e) => { if (!confirm('Izdzēst ' + (w.vards || w.phone) + ' no Darba laika? Nostrādātās stundas un SMS vēsture paliek.')) return; busy(e.target, '…');
    try { await api('delWorker', { phone: w.phone }); closeSheet(); toast('Izdzēsts'); await reI(); setBody(); } catch (err) { toast(err.message, 'err'); unbusy(e.target); } };
  s.querySelector('#wOk').onclick = async (e) => { busy(e.target, '…');
    const am = [...new Set(L.map(x => x.amats))], main = am.length === 1 ? am[0] : L.length ? 'abi' : (w.amats || 'uzk');
    const vv = $('wV').value.trim(), uu = $('wU').value.trim(), nr = $('wP').value.replace(/\D/g, '').replace(/^0+/, '');
    if (!vv || !uu) { toast('Ierakstiet vārdu un uzvārdu', 'err'); return unbusy(e.target); }
    if (nr.length < 6) { toast('Ierakstiet tālruņa numuru', 'err'); return unbusy(e.target); }
    if (!L.length && $('wAk').checked) { toast('Pievienojiet vismaz vienu objektu', 'err'); return unbusy(e.target); }
    if (L.some(x => !x.amats)) { toast('Katram objektam izvēlieties amatu', 'err'); return unbusy(e.target); }
    try { await api('saveWorker', { phone: '+' + $('wC').value + nr, oldPhone: n ? '' : w.phone, vards: vv + ' ' + uu, amats: main, anorm: L.length ? L[0].anorm : '', objekti: L, aktivs: $('wAk').checked, noSms: n ? !($('wSms') && $('wSms').checked) : true }).then(r => (S._wl = r.welcome, r));
      const UU = [...U].map(k => k.split('|')).filter(([, an]) => L.some(x => x.anorm === an)); let nUn = 0;
      for (const [ph, an] of UU) { try { await api('unassign', { phone: ph, anorm: an }); nUn++; } catch (err) { toast(err.message, 'err'); } }
      closeSheet(); toast((S._wl && S._wl.sent ? 'Saglabāts · SMS ar instrukciju nosūtīta' : 'Saglabāts') + (nUn ? ' · vecais darbinieks noņemts' : '')); await reI(); setBody(); } catch (err) { toast(err.message, 'err'); unbusy(e.target); } };
}

let QRL = null;
const qrLib = () => QRL || (QRL = new Promise((ok) => { if (window.qrcode) return ok(true); const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; sc.onload = () => ok(true); sc.onerror = () => { QRL = null; ok(false); }; document.head.appendChild(sc); }));
function qrSvg(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return ''; } }
async function printStickers() {
  const O = S.I.objekti.filter(o => o.aktivs); if (!O.length) return toast('Nav objektu ar kodu', 'err');
  const full = S.I.cfg.numurs || '', nr = full ? full.replace(/^\+371/, '').replace(/(\d{2})(?=\d)/g, '$1 ').trim() : '[SMS NUMURS]';
  const hasQr = full && await qrLib();
  const cell = (o) => `<div class="sk">
    <div class="top"><div class="lg">SH</div><div class="brand">Selectum Home<span>Darba laiks · Рабочее время</span></div><div class="kd">KODS · КОД<b>${esc(o.kods)}</b></div></div>
    <h4>${esc(o.adrese)}</h4>
    <div class="mid"><div class="steps">
      <div class="st go"><i>▶</i><div><code>START ${esc(o.kods)}</code><small>Sākot darbu · Начало работы</small></div></div>
      <div class="st end"><i>■</i><div><code>STOP</code><small>Beidzot darbu · Конец работы</small></div></div>
      <div class="st q"><i>?</i><div><code>?</code><small>Statuss · Статус</small></div></div>
    </div>${hasQr ? `<div class="qr">${qrSvg('SMSTO:' + full + ':START ' + o.kods)}Noskenē — SMS gatava<br>Сканируй — SMS готово</div>` : ''}</div>
    <div class="nr"><small>Sūti SMS uz numuru<br>Отправь SMS на номер</small><b>${esc(nr)}</b></div>
  </div>`;
  let h = ''; for (let i = 0; i < O.length; i += 6) h += `<div class="pg">${O.slice(i, i + 6).map(cell).join('')}</div>`;
  $('print').innerHTML = `<div class="stk">${h}</div>`; setTimeout(() => print(), 120);
}
