<style>

.prog .big{display:flex;align-items:baseline;gap:6px;margin-top:4px}.prog .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}.prog .big span{font-size:16px;font-weight:800;color:var(--ink2)}

.tabs button{min-height:48px;border:0;border-radius:var(--r-pill,999px);background:transparent;font-size:13.5px;font-weight:800}
.tabs button.on{background:var(--dark);color:var(--ondark)}
/* kalendārs */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;font-weight:800;color:var(--ink3);text-align:center;padding:4px 0}

.cal .d.we{background:transparent;opacity:.55}.cal .d.blank{visibility:hidden}
.cal .d.done{background:var(--mint)}.cal .d.rain{background:var(--sky)}.cal .d.got{background:var(--sand)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}.cal .d.sel{outline:2px dashed var(--ink);outline-offset:-2px}
@media(max-width:560px){.cal .d{min-height:58px;padding:6px}.cal .d small{display:none}.cal .d span{font-size:11px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.grid2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.grid2>.main{flex:999 1 560px;min-width:0}.grid2>.side{flex:1 1 300px;min-width:0}
.log{display:flex;flex-direction:column;gap:8px}.log div{padding:10px 12px;border-radius:var(--r-lg,20px);background:var(--surf)}
.log b{display:block;font-size:13.5px;font-weight:800}.log span{font-size:12px;font-weight:700;color:var(--ink2)}
/* objekti */
.search{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.search input{flex:1 1 220px;height:48px;border:0;border-radius:var(--r-pill,999px);background:var(--surf);padding:0 18px;font-size:16px;font-weight:700;min-width:0}
.obj{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg,20px);background:var(--surf);border:0;width:100%;text-align:left}

.obj.off{opacity:.6}
/* lapas */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:var(--r-xl,28px) var(--r-xl,28px) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 14px}.sheet .hd h3{margin:0;flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.f{margin:0 0 12px}.f label,.f .lb{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 6px 4px}
.f input,.f select,.f textarea{width:100%;height:48px;border:0;border-radius:var(--r-lg,20px);background:var(--surf);padding:0 16px;font-size:16px;font-weight:700}
.f textarea{height:auto;min-height:80px;padding:12px 16px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.photos .ph{aspect-ratio:1;border-radius:var(--r-lg,20px);background:var(--surf) center/cover no-repeat;position:relative}

.photos .ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.checks{border-radius:var(--r-xl,28px);background:var(--surf);padding:4px}
.checks label{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;font-size:15px;font-weight:700}
.checks input{width:22px;height:22px;accent-color:var(--ink);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:44px;padding:0 14px;border:0;border-radius:var(--r-pill,999px);background:var(--surf);font-size:13.5px;font-weight:800}
.chips button.on{background:var(--dark);color:var(--ondark)}
.chips.vadf{flex-wrap:nowrap;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}.chips.vadf::-webkit-scrollbar{display:none}.chips.vadf button{flex:none;white-space:nowrap}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;margin-top:14px}
.acts button{min-height:56px;border:0;border-radius:var(--r-pill,999px);font-size:16px;font-weight:800}
.btn-dk{background:var(--dark);color:var(--ondark)}.btn-rose{background:var(--rose)}.btn-lt{background:var(--surf)}
.thumbs{display:flex;gap:6px;margin-top:6px}.thumbs img{width:56px;height:56px;border-radius:var(--r-md,14px);object-fit:cover;background:var(--surf2)}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.gate .card{width:min(380px,100%);text-align:center;padding:28px 22px}
.gate input{width:100%;height:56px;border:0;border-radius:var(--r-lg,20px);background:var(--surf2);text-align:center;font-size:22px;font-weight:800;margin:14px 0 10px}
.gate input::placeholder{font-size:16px;font-weight:700;color:var(--ink3)}
.gate .err{min-height:20px;color:var(--bad);font-weight:700;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);padding:12px 18px;border-radius:var(--r-pill,999px);background:var(--dark);color:var(--ondark);font-weight:800;font-size:14px}

.skel{height:64px;border-radius:var(--r-xl,28px);background:var(--surf);opacity:.6;margin-bottom:8px}
.copy{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);margin:24px 0 0}

.sk{position:relative;height:86mm;border:1.6px dashed #9aa6a0;border-radius:5mm;padding:5mm;box-sizing:border-box;display:flex;flex-direction:column;break-inside:avoid;overflow:hidden;background:#fff}
.sk .top{display:flex;align-items:center;gap:2.5mm;margin:-5mm -5mm 3.5mm;padding:3.2mm 5mm;background:#dff3ea;border-bottom:1.2px solid #b9dcc9}
.sk .lg{width:7mm;height:7mm;border-radius:2mm;background:#14201b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:8.5pt;letter-spacing:-.2pt}
.sk .brand{font-size:7.5pt;font-weight:800;letter-spacing:.9pt;text-transform:uppercase;line-height:1.15}.sk .brand span{display:block;font-weight:700;letter-spacing:.4pt;color:#3d5a4c}
.sk .kd{margin-left:auto;text-align:right;font-size:6.5pt;font-weight:800;letter-spacing:.6pt;color:#3d5a4c;line-height:1}.sk .kd b{display:block;font-size:19pt;color:#14201b;letter-spacing:0;margin-top:.6mm}
.sk h4{margin:0 0 3mm;font-size:12.5pt;font-weight:800;line-height:1.2;max-height:2.4em;overflow:hidden}
.sk .mid{display:flex;gap:4mm;flex:1;min-height:0}
.sk .steps{flex:1;display:flex;flex-direction:column;gap:2.4mm}
.sk .st{display:flex;align-items:center;gap:2.5mm}
.sk .st i{font-style:normal;width:6mm;height:6mm;border-radius:50%;display:grid;place-items:center;font-size:8pt;font-weight:800;color:#fff;flex:none}
.sk .st.go i{background:#1e7a4a}.sk .st.end i{background:#b42318}.sk .st.q i{background:#5b6b64}
.sk .st small{display:block;font-size:7pt;font-weight:700;color:#4a5a53;line-height:1.25}
.sk .st code{font-family:inherit;font-size:14pt;font-weight:800;background:#14201b;color:#fff;border-radius:1.8mm;padding:.4mm 2.4mm;letter-spacing:.4pt;white-space:nowrap}
.sk .st.q code{font-size:11pt;background:#e8ecea;color:#14201b}
.sk .qr{width:27mm;flex:none;text-align:center;font-size:6.3pt;font-weight:700;color:#4a5a53;line-height:1.25}.sk .qr svg{width:27mm;height:27mm;display:block;margin-bottom:1mm}
.sk .nr{margin:3mm -5mm -5mm;padding:2.6mm 5mm;background:#14201b;color:#fff;display:flex;align-items:baseline;gap:2.5mm}
.sk .nr small{font-size:7pt;font-weight:700;opacity:.8;line-height:1.2}.sk .nr b{margin-left:auto;font-size:17pt;font-weight:800;letter-spacing:.6pt}
@media print{@page{size:A4;margin:9mm}}

</style>
<style id="sh-polish">
@media (min-width:1000px){.list:not(:has(.stop)){display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px;align-items:start}}   /* datorā saraksti kolonnās (maršruts paliek secībā) *//* pieskāriena sajūta, iPhone pietuvinājums, samazināta kustība */
button:not(:disabled):active{scale:.97}
button,.chip,.tab{-webkit-user-select:none;user-select:none;touch-action:manipulation}

.leaflet-touch .leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important}

</style>

<body>
<section class="gate" id="vGate" hidden>
  <form class="card" id="gateForm">
    <h2 style="margin:0;font-size:22px;font-weight:800">SH | Darba laiks</h2>
    <p style="margin:4px 0 0;color:var(--ink3);font-weight:700;font-size:14px">Ienāciet ar savu portāla PIN</p>
    <input id="gPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <div class="err" id="gErr"></div>
    <button class="pill dk big" style="width:100%" type="submit">Ienākt</button>
    <p class="copy">© VAITKEVIX, SIA</p>
  </form>
</section>

<nav class="side-nav" id="sideNav" aria-label="Sadaļas"></nav>
<main class="wrap" id="vApp" hidden>
  <header class="top">
    <span class="lg" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <div class="t"><b class="bn">Darba laiks</b><small id="hdSub">Objekti pa adresēm · SMS</small></div>
    <button class="ib" id="btnTheme" aria-label="Tumšais režīms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" id="btnRefresh" aria-label="Atjaunot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ib dk" id="btnMe" aria-label="Profils">··</button>
  </header>
  <div id="view"></div>
  <p class="copy">© VAITKEVIX, SIA</p>
</main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="print"></div>

<script>
'use strict';
const API = 'https://vaitkevix.cloud/sh/api/dl', PINK = 'shd_pin';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { pin: ls.get(PINK) || '', tab: 'obj', day: '', f: 'all', q: '', sel: '', D: null, O: null, T: null, set: 'obj', I: null, kam: 'visi' };
const ROLE = { admin: 'Administrators', vaditajs: 'Pieteicējs', skatitajs: 'Skatītājs' }, RW = { admin: 3, vaditajs: 2, skatitajs: 0 };
const AM = { uzk: 'Uzkopējs', set: 'Sētnieks', abi: 'Abi' }, WD = ['P', 'O', 'T', 'C', 'Pk', 'S', 'Sv'];
const MON = ['janvāris', 'februāris', 'marts', 'aprīlis', 'maijs', 'jūnijs', 'jūlijs', 'augusts', 'septembris', 'oktobris', 'novembris', 'decembris'];
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = (d) => { const w = new Date(d + 'T12:00:00Z').getUTCDay(); return w === 0 ? 7 : w; };
const lvLong = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('lv-LV', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const lvS = (d) => d ? (+d.slice(8, 10)) + '.' + d.slice(5, 7) + '.' : '';
const H = (m) => { m = Math.round(+m || 0); return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') + ' min' : ''); };
const Hs = (m) => (Math.round((+m || 0) / 6) / 10).toLocaleString('lv-LV') + ' h';
const can = (n) => S.D && (RW[S.D.me.role] || 0) >= n;
const hm = (t) => String(t || '').slice(11, 16) || String(t || '').slice(0, 5);

function toast(t, kind) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
const NET = 'Nav interneta vai vājš signāls — mēģiniet vēlreiz';
async function api(action, data) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  let r; try { r = await fetch(API, { method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, data || {})) }); }
  catch (e) { const er = new Error(NET); er.code = 'net'; throw er; } finally { clearTimeout(tm); }
  const j = await r.json().catch(() => ({ ok: false, error: 'Serveris neatbild — mēģiniet vēlreiz', code: 'net' }));
  if (!j.ok) { const e = new Error(j.error || 'Kļūda'); e.code = j.code; throw e; }
  return j;
}
function sheet(html) { closeSheet(); const b = document.createElement('div'); b.className = 'sheet-bg'; b.id = 'sheetBg'; b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('click', e => { if (e.target.closest('[data-x]') || e.target === b) closeSheet(); }); document.body.appendChild(b); return b.firstChild; }
function closeSheet() { const b = $('sheetBg'); if (b) b.remove(); }
const XB = '<button class="ib" data-x aria-label="Aizvērt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
const busy = (b, t) => { b.disabled = true; b.dataset.t = b.textContent; b.textContent = t; };
const unbusy = (b) => { b.disabled = false; if (b.dataset.t) b.textContent = b.dataset.t; };

/* Punkts + teksts (ne tikai krāsa) */
function stTxt(r) { return !r || r.statuss === 'nevajag' ? 'nevajag' : r.statuss === 'darba' ? 'darbā ' + r.laiks : r.statuss === 'beidza' ? 'beidza ' + (r.beidz || '') : 'nav'; }
function dot(r) { const s = r && r.statuss; return `<i class="pd ${s === 'darba' ? 'g' : s === 'beidza' ? 'b' : s === 'nav' ? 'r' : 'n'}" aria-hidden="true"></i>`; }
const roleLine = (o, k) => { const P = (o[k] && o[k].ppl) || []; const dd = P.length > 1 ? `<b class="pds" title="${P.length} darbinieki">${P.map(s => dot({ statuss: s })).join('')}</b>` : dot(o[k]);
  return `<span>${dd}${AM[k]}<em>${esc(stTxt(o[k]))}</em></span>`; };

/* ---------- ieeja ---------- */
function showGate(msg) { $('vApp').hidden = true; $('tabs').hidden = true; $('sideNav').hidden = true; $('vGate').hidden = false; $('gErr').textContent = msg || ''; setTimeout(() => $('gPin').focus(), 100); }
$('gateForm').onsubmit = async (e) => { e.preventDefault(); S.pin = $('gPin').value.trim(); if (!S.pin) return; try { await load(); ls.set(PINK, S.pin); } catch (err) { showGate(err.message); } };
function logout() { ls.del(PINK); S.pin = ''; S.D = null; closeSheet(); showGate(''); }

async function load() {
  const r = await api('boot', S.day ? { datums: S.day } : {});
  S.D = r; if (!S.day) S.day = r.today;
  $('vGate').hidden = true; $('vApp').hidden = false;
  $('hdSub').textContent = r.me.name + ' · ' + (ROLE[r.me.role] || r.me.role);
  $('btnMe').textContent = r.me.name.replace(/^SIA\s+/i, '').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  drawTabs(); await draw();
}
function tabsList() { return [['obj', 'Objekti'], ['tab', 'Tabele']].concat(can(2) ? [['wrk', 'Darbinieki'], ['sms', 'SMS']] : []).concat(can(3) ? [['set', 'Iestatījumi']] : []); }
function drawTabs() {
  const T = tabsList(); if (!T.some(x => x[0] === S.tab)) S.tab = 'obj';
  const b = ([k, l]) => `<button type="button" data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`;
  $('tabs').innerHTML = T.map(b).join(''); $('tabs').hidden = false;
  $('sideNav').innerHTML = T.map(b).join('') + `<div class="sm">${S.D ? esc(S.D.kopsavilkums.objekti) + ' objekti · ' + esc(S.D.kopsavilkums.darbinieki) + ' darbinieki' : ''}</div>`; $('sideNav').hidden = false;
  document.body.classList.add('has-nav');
}
const goTab = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; S.tab = b.dataset.t; drawTabs(); draw(); scrollTo(0, 0); };
$('tabs').onclick = goTab; $('sideNav').onclick = goTab;
$('btnRefresh').onclick = () => load().then(() => toast('Atjaunots')).catch(err => toast(err.message, 'err'));
function applyTheme(t) { document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; }
$('btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); ls.set('sh_theme', t); };
addEventListener('storage', (e) => { if (e.key === 'sh_theme') applyTheme(e.newValue); });
addEventListener('message', (e) => { const m = e.data; if (e.origin === location.origin && m && m.sh === 'theme') applyTheme(m.t); });
$('btnMe').onclick = () => { const s = sheet(`<div class="hd"><h3>${esc(S.D.me.name)}</h3>${XB}</div><p style="font-weight:700;color:var(--ink2);margin:0 0 14px">${esc(ROLE[S.D.me.role] || '')}</p>
  <div class="card" style="margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink2)">Darbinieki atzīmējas ar SMS uz biroja telefonu: <b>START</b> un objekta kods (piem. START 104), beidzot — <b>STOP</b>, statuss — <b>?</b>. Atbildi saņem uzreiz.</div>
  ${S.pin ? '<button class="pill big" style="width:100%" id="mOut">Iziet</button>' : '<button class="pill dk big" style="width:100%" id="mIn">Ienākt ar PIN</button>'}`);
  const o = s.querySelector('#mOut'); if (o) o.onclick = logout; const i = s.querySelector('#mIn'); if (i) i.onclick = () => { closeSheet(); showGate(''); }; };

async function draw() {
  const v = $('view');
  try {
    if (S.tab === 'obj') return drawObj(v);
    if (S.tab === 'tab') return await drawTab(v);
    if (S.tab === 'sms') return await drawSms(v);
    if (S.tab === 'set') return await drawSet(v);
    if (S.tab === 'wrk') return await drawWrk(v);
  } catch (err) { v.innerHTML = `<div class="card empty">${esc(err.message)}</div>`; }
}

/* ---------- Objekti ---------- */
function drawObj(v) {
  const D = S.D, K = D.kopsavilkums, wd = dow(S.day) <= 5, isT = S.day === D.today;
  const inW = (o) => o.uzk.statuss === 'darba' || o.set.statuss === 'darba';
  const VAD = [...new Set(D.objekti.map(o => o.vaditajs || ''))].sort((a, b) => !a ? 1 : !b ? -1 : a.localeCompare(b, 'lv'));
  if (S.vad == null) S.vad = ls.get('dl_vad') || ''; if (S.vad && !VAD.includes(S.vad === '-' ? '' : S.vad)) S.vad = '';
  const B0 = S.vad ? D.objekti.filter(o => (o.vaditajs || '') === (S.vad === '-' ? '' : S.vad)) : D.objekti.slice();
  const cnt = { all: B0.length, darba: B0.filter(inW).length, miss: B0.filter(o => o.trukst).length, ok: B0.filter(o => !o.trukst).length };
  let L = B0.slice(); const q = S.q.toLowerCase();
  if (S.f === 'miss') L = L.filter(o => o.trukst); if (S.f === 'ok') L = L.filter(o => !o.trukst); if (S.f === 'darba') L = L.filter(inW);
  if (q) L = L.filter(o => (o.adrese + ' ' + o.kods + ' ' + o.vaditajs).toLowerCase().includes(q));
  L.sort((a, b) => (b.trukst - a.trukst) || a.adrese.localeCompare(b.adrese, 'lv'));
  const gw = D.varteja, gwOk = gw.iestatita && gw.ping;
  v.innerHTML = `<div class="pt2"><h1 class="pt">Objekti</h1><small>${isT ? 'atjaunots ' + new Date().toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit' }) : ''}</small></div>
    ${can(2) && !gwOk ? `<div class="banner sand">${'<span class="dot">!</span>'}<div><b>${gw.iestatita ? 'SMS telefons vēl nav sūtījis ziņas' : 'SMS vārteja vēl nav pieslēgta'}</b><span>${gw.iestatita ? 'Pārbaudiet, vai telefonā SMS Gateway ir ieslēgts.' : 'Kad administrators pieslēgs SMS telefonu, atzīmes parādīsies šeit.'}</span></div></div>` : ''}
    <div class="dayb"><button class="ib" data-d="-1" aria-label="Iepriekšējā diena">‹</button><span class="lbl">${esc(lvLong(S.day))}${isT ? ' · šodien' : ''}</span><button class="ib" data-d="1" aria-label="Nākamā diena" ${isT ? 'disabled' : ''}>›</button></div>
    <div class="kp"><button class="mint" data-f="ok"><b>${K.kartiba}</b><span>viss kārtībā</span></button><button class="rose" data-f="miss"><b>${wd ? K.trukst : '—'}</b><span>${wd ? 'kāds nav darbā' : 'brīvdiena'}</span></button>
      <div class="sky"><b>${K.darba}</b><span>darbinieki šobrīd darbā</span></div></div>
    <div class="search"><input id="oq" placeholder="Meklēt adresi vai kodu" value="${esc(S.q)}" aria-label="Meklēt"></div>
    ${VAD.length > 1 ? `<div class="chips vadf" id="oV" role="group" aria-label="Objektu vadītājs">${[['', 'Visi vadītāji']].concat(VAD.map(x => [x || '-', x || 'Bez vadītāja'])).map(([k, l]) => `<button type="button" data-v="${esc(k)}" class="${S.vad === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` : ''}
    <div class="seg" style="margin:0 0 10px" id="oF">${[['all', 'Visi ' + cnt.all], ['darba', 'Darbā ' + cnt.darba], ['miss', 'Trūkst ' + cnt.miss], ['ok', 'Kārtībā ' + cnt.ok]].map(([k, l]) => `<button data-f="${k}" class="${S.f === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="legend2"><span><i class="pd g"></i>darbā</span><span><i class="pd b"></i>beidza</span><span><i class="pd r"></i>nav darbā</span></div>
    <div class="split"><div class="list">${L.map(o => `<button class="orow ${S.sel === o.anorm ? 'sel' : ''}" data-o="${esc(o.anorm)}"><div class="tx"><b>${esc(o.adrese)}</b><span>kods ${esc(o.kods)}${o.vaditajs ? ' · ' + esc(o.vaditajs) : ''}</span></div><div class="roles">${roleLine(o, 'uzk')}${roleLine(o, 'set')}</div></button>`).join('')
      || `<div class="card empty">${D.objekti.length ? 'Nekas neatbilst' : 'Darba laikam vēl nav objektu.' + (can(3) ? ' Iestatījumos piešķiriet objektiem SMS kodus.' : '')}</div>`}</div><div class="pane" id="pane"></div></div>`;
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.f = b.dataset.f; drawObj(v); });
  v.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.vad = b.dataset.v; ls.set('dl_vad', S.vad); drawObj(v); });
  v.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { S.day = addDays(S.day, +b.dataset.d); if (S.day > S.D.today) S.day = S.D.today; await load().catch(err => toast(err.message, 'err')); });
  const oq = $('oq'); oq.oninput = () => { S.q = oq.value; const p = oq.selectionStart; drawObj(v); const n = $('oq'); n.focus(); n.setSelectionRange(p, p); };
  v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => openObj(b.dataset.o));
  if (S.sel && innerWidth >= 1000) openObj(S.sel, true);
}
async function openObj(anorm, quiet) {
  S.sel = anorm; const wide = innerWidth >= 1000, pane = $('pane');
  document.querySelectorAll('.orow').forEach(b => b.classList.toggle('sel', b.dataset.o === anorm));
  const box = wide && pane ? pane : sheet(`<div class="hd"><h3>Objekts</h3>${XB}</div><div id="objBody"><div class="skel"></div><div class="skel"></div></div>`).querySelector('#objBody');
  if (wide && pane && !quiet) box.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try { const r = await api('objekts', { anorm, datums: S.day }); S.O = r; objHtml(box, r, wide); } catch (err) { box.innerHTML = `<div class="card empty">${esc(err.message)}</div>`; }
}
function objHtml(box, r, wide) {
  const o = r.objekts, isT = r.datums === S.D.today;
  const rc = (k) => { const x = o[k]; if (x.statuss === 'nevajag') return `<div class="rc na"><div class="h">${dot(x)}<b>${AM[k]}</b><em>NEVAJAG</em></div></div>`;
    const okk = x.statuss !== 'nav', P = r.posmi.filter(p => p.amats === k);
    return `<div class="rc ${okk ? 'ok' : 'bad'}"><div class="h">${dot(x)}<b>${AM[k]}</b><em>${x.statuss === 'darba' ? 'DARBĀ' : x.statuss === 'beidza' ? 'BEIDZA' : 'NAV DARBĀ'}</em></div>
      <p>${x.statuss === 'nav' ? (isT ? 'Šodien nav atzīmējies' : 'Šajā dienā nebija atzīmējies') : P.map(p => esc(p.sak) + '–' + (p.beidz ? esc(p.beidz) + ' · ' + H(p.min) : (isT ? 'tagad' : 'nav beigu (aizmirsts STOP) — jālabo')) + (p.vards ? ' · ' + esc(p.vards) : '')).join('<br>')}</p>
      ${x.statuss === 'nav' && isT && can(2) ? `<button class="pill dk" data-rem="${k}">Sūtīt SMS atgādinājumu</button>` : ''}</div>`; };

  load().catch(err => { if (err.code === 'auth') { ls.del(PINK); S.pin = ''; showGate('PIN vairs nederīgs vai nav piekļuves'); }
    else { $('vGate').hidden = true; $('vApp').hidden = false; $('view').innerHTML = `<div class="card empty">${esc(err.message)}<br><button class="pill dk" id="reTry" style="margin-top:12px">Mēģināt vēlreiz</button></div>`; $('reTry').onclick = () => location.reload(); } });
  /* Atjaunojas pati ik minūti (tikai Objektu skatā, kad nav atvērts logs) */
  setInterval(() => { if (S.D && S.tab === 'obj' && !$('sheetBg') && !document.hidden && S.day === S.D.today) load().catch(() => 0); }, 60000);
  addEventListener('resize', () => { if (S.tab === 'obj' && S.D) { const w = innerWidth >= 1000; if (w !== S.wide) { S.wide = w; drawObj($('view')); } } });
})();
</script>
